services:
  - type: web
    name: smartgov-attendance-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartgov-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"

databases:
  - name: smartgov-db
    plan: free
    databaseName: smartgov
    user: smartgov_user
